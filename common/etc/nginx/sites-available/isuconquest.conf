server {
  root /home/isucon/isucon12-final/webapp/public;
  listen 80 default_server;
  listen [::]:80 default_server;

  location ~ ^/user/\d+[0-4]/ {
    proxy_pass http://s1.maca.jp:8080;
    proxy_set_header Host $host;
  }

  location ~ ^/user/\d+[5-9]/ {
    proxy_pass http://s2.maca.jp:8080;
    proxy_set_header Host $host;
  }

  location = /user {
    proxy_pass http://localhost:8080;
    proxy_set_header Host $host;
  }

  location ~ /admin/user/\d+[0-4]/ {
    proxy_pass http://s1.maca.jp:8080;
    proxy_set_header Host $host;
  }

  location ~ /admin/user/\d+[5-9]/ {
    proxy_pass http://s2.maca.jp:8080;
    proxy_set_header Host $host;
  }

  location /admin {
    proxy_pass http://localhost:8080;
    proxy_set_header Host $host;
  }

  location /login {
    proxy_pass http://localhost:8080;
    proxy_set_header Host $host;
  }

  location /health {
    proxy_pass http://localhost:8080;
    proxy_set_header Host $host;
  }

  location /initialize {
    proxy_read_timeout    600;
    proxy_pass http://localhost:8080;
    proxy_set_header Host $host;
  }

  location / {
    root /home/isucon/webapp/admin/dist;
    try_files $uri $uri/ /index.html;
  }
}
